<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Photography Gallery</title>
  <meta name="description" content="A modern, responsive photography gallery with category filters and a fullscreen lightbox." />

  <link rel="stylesheet" href="style.css" />

  <!-- Display face for headlines + a clean workhorse sans for UI/body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ============ HEADER / NAV ============ -->
  <header class="site-header">
    <div class="site-header__inner">
      <a href="#top" class="brand">
        <span class="brand__mark" aria-hidden="true">◍</span>
        <span class="brand__name">Aperture&nbsp;Gallery</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="#gallery">Gallery</a>
        <a href="#top">About</a>
      </nav>
    </div>
  </header>

  <main id="top">

    <!-- ============ HERO ============ -->
    <section class="hero">
      <p class="hero__eyebrow">A curated collection &mdash; four rolls, one story</p>
      <h1 class="hero__title">Modern Photography Gallery</h1>
      <p class="hero__subtitle">
        Nature, sea, cars and cities &mdash; browse the collection below, filter by
        category, and click any frame to view it full screen.
      </p>
    </section>

    <!-- Decorative film-strip divider (purely visual, hidden from assistive tech) -->
    <div class="filmstrip" aria-hidden="true">
      <div class="filmstrip__perf"></div>
      <div class="filmstrip__perf"></div>
    </div>

    <!-- ============ FILTERS ============ -->
    <section class="filters" aria-label="Filter gallery by category">
      <button type="button" class="filter-btn is-active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="nature">Nature</button>
      <button type="button" class="filter-btn" data-filter="sea">Sea</button>
      <button type="button" class="filter-btn" data-filter="cars">Cars</button>
      <button type="button" class="filter-btn" data-filter="cities">Cities</button>
    </section>

    <!-- ============ GALLERY GRID ============ -->
    <!-- Cards are generated by JavaScript from the imageData array in script.js
         so adding/removing photos never requires touching this markup. -->
    <section id="gallery" class="gallery" aria-label="Photo gallery">
      <!-- JS injects .gallery__item buttons here -->
    </section>

  </main>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Close image viewer">&times;</button>

    <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>

    <figure class="lightbox__figure">
      <img class="lightbox__image" id="lightboxImage" src="" alt="" />
      <figcaption class="lightbox__caption">
        <span id="lightboxCaption"></span>
        <span class="lightbox__counter" id="lightboxCounter"></span>
      </figcaption>
    </figure>

    <button type="button" class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next image">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
